<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Survey</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>90s Sitcom Survey</h1>
    <nav>
        <a href="tierlist.html">Tierlist</a>
    
    </nav>
    <form method="get">
        <label for="name">Name: </label>
        <input type="text" name="name" id="name" value="Please enter your first and last name">
        <br><br>

        <label for="email">E-mail: </label>
        <input type="email" name="email" id="email" value="Please enter your email address" >
        <br><br>

        <label for="comments">Comments:</label> 
        <textarea name="comments" id="comments" rows="4" cols="40"></textarea>
        <br><br>

        <p>Have you watched Martin before?</p>

        <input type="radio" id="yes" name="watchedmartin" value="yes">
        <label for="yes">Yes</label>
        <input type="radio" id="no" name="watchedmartin" value="no">
        <label for="no">No</label>
        <br><br>

        <label for="favsitcom">Select your favorite sitcom:</label>
    
    <select name="favsitcom" id="favsitcom">
        <option value="" disabled selected>Select your favorite sitcom</option>
        <option value="martin">Martin</option>
        <option value="livingsingle">Living Single</option>
        <option value="moesha">Moesha</option>
        <option value="freshprince">The Fresh Prince of Bel-Air</option>
    </select>

    

        <p>Which sitcoms have you seen?</p>
        <input type="checkbox" id="theparkers" name="seen" value="theparkers">
        <label for="theparkers"> The Parkers</label>
        <input type="checkbox" id="sister" name="seen" value="sister">
        <label for="sister"> Sister, Sister</label>
        <input type="checkbox" id="moesha" name="seen" value="moesha">
        <label for="moesha"> Moesha</label>
        <br><br>
        
        <input type="submit" value="Submit"> 


    



    </form>
    
        
    
    
</body>
</html>
